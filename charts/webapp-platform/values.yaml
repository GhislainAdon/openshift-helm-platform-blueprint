# -----------------------------------------------------------------------------
# webapp-platform - default values
#
# These defaults are deliberately conservative: everything that needs an
# external dependency (Istio, Prometheus Operator, External Secrets, VPA...)
# is OFF by default and enabled per environment in values-<env>.yaml.
# No credentials are ever stored here: secrets are referenced, never inlined.
# -----------------------------------------------------------------------------

global:
  # Logical environment name, used in labels, alerts and dashboards.
  environment: dev
  # Registry prefix prepended to every image repository below.
  imageRegistry: harbor.example.org/webapp
  imagePullSecrets: []
  # - name: harbor-pull-secret

nameOverride: ""
fullnameOverride: ""

commonLabels: {}
commonAnnotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Application pods do not talk to the Kubernetes API.
  automountServiceAccountToken: false

# Pod-level security context shared by every workload.
# No runAsUser / fsGroup on purpose: on OpenShift the restricted-v2 SCC injects
# a namespace-scoped arbitrary UID. On vanilla Kubernetes the images must
# declare a non-root USER.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# -----------------------------------------------------------------------------
# Exposure: OpenShift Route OR Kubernetes Ingress (never both)
# -----------------------------------------------------------------------------
exposure:
  # route | ingress | none
  type: route
  host: app-dev.example.org
  # Component that receives external traffic (the SAML SP sits in front).
  targetComponent: authProxy
  route:
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
    annotations:
      haproxy.router.openshift.io/timeout: 60s
      haproxy.router.openshift.io/hsts_header: max-age=31536000;includeSubDomains
  ingress:
    className: ""
    annotations: {}
    tls:
      enabled: true
      secretName: ""   # defaults to <fullname>-tls

# -----------------------------------------------------------------------------
# Frontend: nginx serving the SPA and reverse-proxying /api to the backend
# -----------------------------------------------------------------------------
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  containerPort: 8080
  service:
    type: ClusterIP
    port: 8080
  podAnnotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  probes:
    startup:
      enabled: true
      httpGet: {path: /healthz, port: http}
      periodSeconds: 5
      failureThreshold: 12
    readiness:
      enabled: true
      httpGet: {path: /healthz, port: http}
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      enabled: true
      httpGet: {path: /healthz, port: http}
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 3
  # CORS allow-list rendered into the nginx config (exact origins, https only).
  cors:
    enabled: true
    allowedOrigins:
      - https://app-dev.example.org
    allowedMethods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    allowedHeaders: "Authorization, Content-Type, X-Requested-With"
    maxAge: 600
  # Max upload size accepted by nginx (client_max_body_size).
  clientMaxBodySize: 10m
  env: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  metrics:
    # nginx-prometheus-exporter sidecar scraping the local stub_status endpoint
    enabled: true
    image:
      repository: mirror/nginx/nginx-prometheus-exporter
      tag: "1.3.0"
      pullPolicy: IfNotPresent
    port: 9113
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 50m, memory: 32Mi}

# -----------------------------------------------------------------------------
# Auth proxy: Apache httpd + SAML 2.0 Service Provider (mod_auth_mellon)
# -----------------------------------------------------------------------------
authProxy:
  enabled: true
  replicaCount: 1
  image:
    repository: auth-proxy
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  containerPort: 8080
  service:
    type: ClusterIP
    port: 8080
  podAnnotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi
  probes:
    startup:
      enabled: true
      httpGet: {path: /server-health, port: health}
      periodSeconds: 5
      failureThreshold: 24
    readiness:
      enabled: true
      httpGet: {path: /server-health, port: health}
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      enabled: true
      httpGet: {path: /server-health, port: health}
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
  saml:
    # Entity ID / endpoint path of the Service Provider (public, non-secret).
    spEntityId: https://app-dev.example.org/mellon/metadata
    endpointPath: /mellon
    # Secret holding sp.key, sp.crt and idp-metadata.xml. Provisioned by
    # External Secrets / Vault or created out-of-band - never committed.
    secretName: webapp-saml-sp
    # Paths that bypass SAML authentication (static assets...). Health checks
    # are served on an internal port (8081) that is never exposed.
    publicPaths:
      - /assets/
  env: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  metrics:
    # apache_exporter sidecar reading mod_status on localhost
    enabled: true
    image:
      repository: mirror/lusitaniae/apache-exporter
      tag: "v1.0.9"
      pullPolicy: IfNotPresent
    port: 9117
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 50m, memory: 32Mi}

# -----------------------------------------------------------------------------
# Backend: Node.js REST API
# -----------------------------------------------------------------------------
backend:
  enabled: true
  replicaCount: 1
  image:
    repository: backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  containerPort: 3000
  service:
    type: ClusterIP
    port: 3000
  podAnnotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    startup:
      enabled: true
      httpGet: {path: /health/live, port: http}
      periodSeconds: 5
      failureThreshold: 30
    readiness:
      enabled: true
      httpGet: {path: /health/ready, port: http}
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      enabled: true
      httpGet: {path: /health/live, port: http}
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
  # Prometheus metrics exposed by the app itself (prom-client).
  metrics:
    enabled: true
    path: /metrics
  # Base URL of the external partner API. When istio.enabled=true the chart
  # overrides it with plain http://<partner host> and the mesh does mTLS + CONNECT.
  partnerApi:
    url: https://partner-api.example.org
  # Extra environment variables. NODE_TLS_REJECT_UNAUTHORIZED=0 is rejected
  # at render time (see _helpers.tpl "webapp.validate").
  env:
    - name: NODE_ENV
      value: production
    - name: LOG_LEVEL
      value: info
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

# -----------------------------------------------------------------------------
# MongoDB: single-member StatefulSet + PVC, idempotent user bootstrap Job
# -----------------------------------------------------------------------------
mongodb:
  enabled: true
  image:
    repository: mirror/library/mongo
    tag: "7.0"
    pullPolicy: IfNotPresent
  port: 27017
  database: webapp
  auth:
    # Secret with keys: root-username, root-password, app-username,
    # app-password, metrics-username, metrics-password.
    secretName: webapp-mongodb-credentials
  persistence:
    enabled: true
    storageClass: ""
    accessModes: ["ReadWriteOnce"]
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # WiredTiger cache sized from the memory limit (GiB). Keep < 50% of the limit.
  wiredTigerCacheSizeGB: 0.25
  probes:
    startup:
      enabled: true
      tcpSocket: {port: mongodb}
      periodSeconds: 5
      failureThreshold: 30
    readiness:
      enabled: true
      exec:
        command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      enabled: true
      tcpSocket: {port: mongodb}
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 6
  bootstrap:
    # Helm hook Job (post-install/post-upgrade) creating or updating the
    # application and metrics users. Safe to run any number of times.
    enabled: true
    backoffLimit: 6
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 3600
  metrics:
    enabled: true
    image:
      repository: mirror/percona/mongodb_exporter
      tag: "0.43.1"
      pullPolicy: IfNotPresent
    port: 9216
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}
  # Merged over the global podSecurityContext. On vanilla Kubernetes the
  # official image does not declare a non-root USER: set runAsUser/fsGroup
  # here (e.g. 999). Leave empty on OpenShift (restricted-v2 assigns them).
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Secrets: how the Secrets referenced above come to exist
#   existingSecret     -> created out-of-band (sealed-secrets, SOPS, manual)
#   externalSecret     -> External Secrets Operator (ExternalSecret CR)
#   vaultStaticSecret  -> HashiCorp Vault Secrets Operator (VaultStaticSecret CR)
# -----------------------------------------------------------------------------
secrets:
  provider: existingSecret
  externalSecret:
    apiVersion: external-secrets.io/v1
    secretStoreRef:
      kind: ClusterSecretStore
      name: vault-backend
    refreshInterval: 1h
  vault:
    mount: kv
    type: kv-v2
    vaultAuthRef: vault-auth
    refreshAfter: 1h
  # One entry per Secret to materialise. "name" must match the secretName used
  # by the components above; "remotePath" is the path in the secret backend.
  managed:
    - name: webapp-mongodb-credentials
      remotePath: webapp/dev/mongodb
      keys:
        - root-username
        - root-password
        - app-username
        - app-password
        - metrics-username
        - metrics-password
    - name: webapp-saml-sp
      remotePath: webapp/dev/saml-sp
      keys:
        - sp.key
        - sp.crt
        - idp-metadata.xml

# -----------------------------------------------------------------------------
# Scalability: HPA (+ optional VPA in recommendation mode) and PDBs
# -----------------------------------------------------------------------------
scalability:
  enabled: false
  hpa:
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Pods
            value: 1
            periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Percent
            value: 100
            periodSeconds: 60
          - type: Pods
            value: 2
            periodSeconds: 60
        selectPolicy: Max
    components:
      frontend:
        minReplicas: 2
        maxReplicas: 5
      authProxy:
        minReplicas: 2
        maxReplicas: 4
      backend:
        minReplicas: 2
        maxReplicas: 5
  vpa:
    # Recommendation-only by default ("Off") so it never fights the HPA.
    enabled: false
    updateMode: "Off"
  pdb:
    enabled: true
    minAvailable: 1

# -----------------------------------------------------------------------------
# Observability (Prometheus Operator CRDs + Grafana sidecar dashboards)
# -----------------------------------------------------------------------------
monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    thresholds:
      errorRatePercent: 5
      latencyP95Seconds: 1
      restartsPer30m: 3
      hpaAtMaxForMinutes: 15
      certExpiryDays: 14
      pvcFreePercent: 15
  grafanaDashboard:
    enabled: false
    # Label watched by the Grafana dashboard sidecar.
    labels:
      grafana_dashboard: "1"

# -----------------------------------------------------------------------------
# NetworkPolicies: default deny ingress, explicit allows, restricted egress
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: true
  # Namespaces hosting the ingress controller / OpenShift router.
  ingressNamespaceSelector:
    matchLabels:
      network.openshift.io/policy-group: ingress
  # Namespaces hosting Prometheus (user-workload monitoring on OpenShift).
  monitoringNamespaceSelector:
    matchLabels:
      network.openshift.io/policy-group: monitoring
  egress:
    restrict: true
    dns:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
        - {port: 5353, protocol: UDP}
        - {port: 5353, protocol: TCP}
    # Extra destinations (e.g. the corporate proxy) when Istio is disabled.
    extraRules: []
    # - to:
    #     - ipBlock: {cidr: 192.0.2.10/32}
    #   ports:
    #     - {port: 3128, protocol: TCP}

# -----------------------------------------------------------------------------
# Istio egress pattern (backend -> partner API over mTLS via corporate proxy)
# Every Istio object in this chart is gated by istio.enabled.
# -----------------------------------------------------------------------------
istio:
  enabled: false
  # Namespace of the istio control plane / egress gateway.
  controlPlaneNamespace: istio-system
  egressGateway:
    namespace: istio-system
    service: istio-egressgateway
    selector:
      istio: egressgateway
    # Port on which the gateway accepts ISTIO_MUTUAL traffic from the sidecars.
    port: 443
  sidecar:
    outboundTrafficPolicy: REGISTRY_ONLY
  partner:
    name: partner-api
    host: partner-api.example.org
    port: 443
    # DNS when the partner name resolves inside the cluster; STATIC with the
    # proxy address as endpoint when only the proxy can resolve it.
    resolution: DNS
    # Secret in the egress gateway namespace holding tls.crt, tls.key, ca.crt
    # (client certificate presented to the partner). Referenced, never shipped.
    credentialName: partner-api-client-cert
  corporateProxy:
    host: proxy.corp.example
    port: 3128
    # Envoy's http_11_proxy transport socket needs a resolved IP address.
    # 192.0.2.0/24 is the RFC 5737 documentation range: replace per environment.
    address: 192.0.2.10
