{{- /*
Secrets are never rendered with values from this chart. Depending on
secrets.provider the chart either:
  - existingSecret    : renders nothing (Secrets created out-of-band)
  - externalSecret    : renders one ExternalSecret per managed Secret
  - vaultStaticSecret : renders one VaultStaticSecret per managed Secret
*/}}
{{- $provider := .Values.secrets.provider }}
{{- range $s := .Values.secrets.managed }}
{{- if eq $provider "externalSecret" }}
{{- $es := $.Values.secrets.externalSecret }}
---
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $s.name }}
  labels:
    {{- include "webapp.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ $s.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $key := $s.keys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $s.remotePath }}
        property: {{ $key }}
    {{- end }}
{{- else if eq $provider "vaultStaticSecret" }}
{{- $v := $.Values.secrets.vault }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $s.name }}
  labels:
    {{- include "webapp.labels" $ | nindent 4 }}
spec:
  vaultAuthRef: {{ $v.vaultAuthRef }}
  mount: {{ $v.mount }}
  type: {{ $v.type }}
  path: {{ $s.remotePath }}
  refreshAfter: {{ $v.refreshAfter }}
  {{- $targets := list }}
  {{- if and $.Values.authProxy.enabled (eq $s.name $.Values.authProxy.saml.secretName) }}
  {{- $targets = append $targets (include "webapp.componentName" (dict "root" $ "component" "authProxy")) }}
  {{- end }}
  {{- if and $.Values.backend.enabled (eq $s.name $.Values.mongodb.auth.secretName) }}
  {{- $targets = append $targets (include "webapp.componentName" (dict "root" $ "component" "backend")) }}
  {{- end }}
  {{- with $targets }}
  # Restart consumers when the secret rotates.
  rolloutRestartTargets:
    {{- range . }}
    - kind: Deployment
      name: {{ . }}
    {{- end }}
  {{- end }}
  destination:
    name: {{ $s.name }}
    create: true
    overwrite: false
    labels:
      {{- include "webapp.selectorLabels" $ | nindent 6 }}
{{- end }}
{{- end }}
